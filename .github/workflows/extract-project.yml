name: Extract Grok Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore ZIP from Git history
        run: |
          ZIP_COMMIT=$(git log --all --format=%H -- grok-workspace.zip | head -n 1)

          if [ -z "$ZIP_COMMIT" ]; then
            echo "ERROR: grok-workspace.zip was never committed"
            exit 1
          fi

          echo "ZIP found in commit: $ZIP_COMMIT"

          git checkout "$ZIP_COMMIT" -- grok-workspace.zip

          ls -lh grok-workspace.zip

      - name: Extract source project
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q grok-workspace.zip -d extracted

          PROJECT_DIR=$(find extracted -type f -name package.json \
            -not -path '*/.vercel/*' \
            -not -path '*/node_modules/*' \
            -print | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: Source package.json not found"
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "SOURCE PROJECT: $PROJECT_DIR"

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            -exec rm -rf {} +

          cp -a "$PROJECT_DIR"/. .

          rm -rf extracted
          rm -f grok-workspace.zip

      - name: Commit source project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Restore complete source project"
            git push
          fi
