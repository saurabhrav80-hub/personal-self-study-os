name: Extract Grok Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q grok-workspace.zip -d extracted

          PROJECT_DIR=$(dirname "$(find extracted -name package.json -type f -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "package.json not found inside ZIP"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

          rm -rf extracted
          rm -f grok-workspace.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract Grok project"
            git push
          fi
